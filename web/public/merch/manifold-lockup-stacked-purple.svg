  Clear space keep 100 user units (= cap height) free on all sides
  Minimum     2in / 51mm wide for print; below that the lines get fragile

  To recolour, change the single fill on the <svg> element.
  Geometry: crane from web/public/logo.svg; wordmark tracked 0.12em;
  crane ink height 2.8x cap height; mark optically centred.
-->
